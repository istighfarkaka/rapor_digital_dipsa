<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIPSA - Portal CBT & Rapor Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 800px; padding: 25px; }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; }
    .header h2 { color: #1a73e8; font-size: 22px; }
    .header p { color: #666; font-size: 13px; margin-top: 5px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    .form-control:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.2); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .btn-submit { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: #1557b0; }
    .btn-logout { background: #dc3545; margin-top: 20px; }
    .btn-logout:hover { background: #c82333; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .badge-role { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
    .loading { text-align: center; color: #1a73e8; font-weight: bold; font-size: 14px; margin-top: 10px; display: none; }
    .error-msg { color: #dc3545; font-size: 13px; text-align: center; margin-top: 10px; }
    
    .screen { display: none; }
    .screen.active { display: block; }

    /* Style Tabel */
    .table-container { margin-top: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; }
    th { background-color: #f8fafc; color: #333; }
    .section-title { font-size: 16px; font-weight: bold; color: #1a73e8; margin-top: 20px; margin-bottom: 10px; border-left: 4px solid #1a73e8; padding-left: 8px; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- HALAMAN LOGIN -->
    <div class="screen active" id="screen-login">
      <div class="header">
        <h2>DIPSA EXAM & RAPOR</h2>
        <p>Silakan login untuk mengakses portal</p>
      </div>
      <form id="form-login" onsubmit="prosesLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan Username" required autocomplete="off">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required>
        </div>
        <button type="submit" class="btn-submit" id="btn-login">Masuk Aplikasi</button>
      </form>
      <div class="loading" id="loading-login">Memeriksa data di Firestore...</div>
      <div class="error-msg" id="err-login"></div>
    </div>

    <!-- HALAMAN DASHBOARD SESUAI ROLE -->
    <div class="screen" id="screen-dashboard">
      <div class="header">
        <span class="badge-role" id="dash-role">ROLE</span>
        <h2 id="dash-nama">Nama User</h2>
        <p>Selamat Datang di Panel Sistem</p>
      </div>

      <!-- PANEL KHUSUS WAKA KURIKULUM -->
      <div id="panel-waka" style="display: none;">
        
        <div class="section-title">Tambah Akun Satuan</div>
        <form onsubmit="tambahUserSatuan(event)">
          <div class="grid-2">
            <div class="form-group">
              <label>Nama Lengkap</label>
              <input type="text" id="input-nama" class="form-control" placeholder="Nama Lengkap" required>
            </div>
            <div class="form-group">
              <label>Role / Hak Akses</label>
              <select id="input-role" class="form-control" required>
                <option value="waka">Waka Kurikulum</option>
                <option value="walikelas">Wali Kelas</option>
                <option value="gurumapel">Guru Mapel</option>
                <option value="siswa">Siswa</option>
                <option value="walimurid">Wali Murid</option>
              </select>
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Username</label>
              <input type="text" id="input-username" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="text" id="input-password" class="form-control" placeholder="Password" required>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="btn-tambah-user">+ Simpan Akun Baru</button>
        </form>

        <div class="section-title">Daftar Akun Pengguna</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Username</th>
                <th>Role</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-users-body">
              <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>

      </div>

      <!-- PANEL ROLE LAIN -->
      <div id="panel-role-lain" style="display: none;">
        <div id="dash-hak-akses"></div>
      </div>

      <button type="button" class="btn-submit btn-logout" onclick="logout()">Keluar (Logout)</button>
    </div>

  </div>

  <!-- LOAD FIREBASE SDK (MODULE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnPyMzuu4Qo2mZhORxZh3aTUm-TAFmzzU",
      authDomain: "rapor-c7c48.firebaseapp.com",
      projectId: "rapor-c7c48",
      storageBucket: "rapor-c7c48.firebasestorage.app",
      messagingSenderId: "1059367167032",
      appId: "1:1059367167032:web:eaa4527d3ed3f05ae3b2cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Proses Login
    window.prosesLogin = async function(e) {
      e.preventDefault();
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();
      const loading = document.getElementById("loading-login");
      const err = document.getElementById("err-login");
      const btn = document.getElementById("btn-login");

      loading.style.display = "block";
      err.innerText = "";
      btn.disabled = true;

      try {
        const q = query(
          collection(db, "users"), 
          where("username", "==", usernameInput),
          where("password", "==", passwordInput)
        );
        const querySnapshot = await getDocs(q);

        loading.style.display = "none";
        btn.disabled = false;

        if (!querySnapshot.empty) {
          let userData = null;
          querySnapshot.forEach((doc) => { userData = doc.data(); });
          tampilkanDashboard(userData);
        } else {
          err.innerText = "Username atau Password salah!";
        }
      } catch (error) {
        loading.style.display = "none";
        btn.disabled = false;
        err.innerText = "Gagal terhubung ke database: " + error.message;
      }
    };

    function tampilkanDashboard(user) {
      document.getElementById("screen-login").classList.remove("active");
      document.getElementById("screen-dashboard").classList.add("active");

      document.getElementById("dash-nama").innerText = user.nama;
      document.getElementById("dash-role").innerText = "Akses: " + user.role;

      if(user.role.toLowerCase() === "waka") {
        document.getElementById("panel-waka").style.display = "block";
        document.getElementById("panel-role-lain").style.display = "none";
        muatTabelUsersRealtime();
      } else {
        document.getElementById("panel-waka").style.display = "none";
        document.getElementById("panel-role-lain").style.display = "block";
        document.getElementById("dash-hak-akses").innerText = "Selamat datang " + user.nama + ". Fitur sedang disiapkan.";
      }
    }

    // Fitur Tambah Akun Satuan (Realtime ke Firestore)
    window.tambahUserSatuan = async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-tambah-user");
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      try {
        await addDoc(collection(db, "users"), {
          nama: document.getElementById("input-nama").value,
          role: document.getElementById("input-role").value,
          username: document.getElementById("input-username").value,
          password: document.getElementById("input-password").value
        });

        alert("Akun berhasil ditambahkan!");
        document.getElementById("input-nama").value = "";
        document.getElementById("input-username").value = "";
        document.getElementById("input-password").value = "";
      } catch (err) {
        alert("Gagal menambahkan akun: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "+ Simpan Akun Baru";
      }
    };

    // Fitur Baca Tabel Users (Realtime Update)
    function muatTabelUsersRealtime() {
      const tbody = document.getElementById("tabel-users-body");
      
      onSnapshot(collection(db, "users"), (snapshot) => {
        tbody.innerHTML = "";
        let no = 1;

        if(snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data akun.</td></tr>';
          return;
        }

        snapshot.forEach((docSnapshot) => {
          const u = docSnapshot.data();
          const docId = docSnapshot.id;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${no++}</td>
            <td>${u.nama}</td>
            <td>${u.username}</td>
            <td><span class="badge-role">${u.role}</span></td>
            <td>
              <button class="btn-danger" onclick="hapusUser('${docId}', '${u.nama}')">Hapus</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    // Fitur Hapus Akun
    window.hapusUser = async function(docId, nama) {
      if(confirm(`Apakah Anda yakin ingin menghapus akun ${nama}?`)) {
        try {
          await deleteDoc(doc(db, "users", docId));
          alert("Akun berhasil dihapus!");
        } catch (err) {
          alert("Gagal menghapus akun: " + err.message);
        }
      }
    };

    window.logout = function() {
      document.getElementById("form-login").reset();
      document.getElementById("err-login").innerText = "";
      document.getElementById("screen-dashboard").classList.remove("active");
      document.getElementById("screen-login").classList.add("active");
    };
  </script>
</body>
</html>
